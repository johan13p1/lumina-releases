plugins {
	id 'fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'lumina'
}

loom {
	accessWidenerPath = file('src/main/resources/lumina.accesswidener')

	runs {
		client {
			// Dev-only hooks (auto screenshots etc.) are enabled with -Dlumina.dev=true
			vmArg '-Dlumina.dev=true'
			programArgs '--width', '1600', '--height', '900'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// macOS only (WindowMixin): Minecraft ships it there, Loom puts it on the classpath only on a Mac
	compileOnly 'ca.weblite:java-objc-bridge:1.1'
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
